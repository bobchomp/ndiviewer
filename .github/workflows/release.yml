name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number for this release (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version input
        shell: pwsh
        run: |
          if ("${{ inputs.version }}" -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "version must look like 1.2.3"
            exit 1
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/NdiViewer/NdiViewer.csproj

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish src/NdiViewer/NdiViewer.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o publish
          -p:Version=${{ inputs.version }}
          -p:PublishReadyToRun=false

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ inputs.version }} installer\setup.iss

      - name: Verify installer was produced
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "NdiViewer-Setup-*.exe" -ErrorAction Stop
          if (-not $installer) {
            Write-Error "No installer exe found in dist/"
            exit 1
          }
          Write-Host "Built: $($installer.FullName)"

      - name: Create GitHub Release and upload installer
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ inputs.version }}
          name: NDI Viewer v${{ inputs.version }}
          generate_release_notes: true
          files: dist/NdiViewer-Setup-*.exe
